name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 0.5.1 is the devtools CLI. `compact update` installs a compiler
      # toolchain, and this repo compiles with toolchain 0.31.1.
      - name: Install Compact toolchain 0.31.1
        run: |
          compact update 0.31.1
          compact --version

      - name: Install dependencies
        run: npm ci

      - name: Compile Compact contracts
        run: npm run compile

      - name: Run the test suite
        run: npm test

  frontend:
    name: Build the frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build the frontend
        run: npm run frontend:build
